<template id="tpl-en"><h1 class="title">Bicara Krypto Pulse Screener Guide</h1>
<p>Bicara Krypto Pulse is a market screener: it scans every trading pair on our supported exchanges and shows you only the ones that fit what you are looking for. We currently support Binance, Bybit and Gate, with more exchanges coming.</p>
<blockquote>
<p><strong>Important:</strong> Strategies find coins that fit a pattern. They are not buy or sell signals, and nothing in the screener is financial advice. Always check the chart and manage your risk.</p>
</blockquote>
<p><strong>Start at your level:</strong></p>
<div class="tw"><table>
<thead>
<tr class="header">
<th>Level</th>
<th>Read this if</th>
<th>You will learn</th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td><strong>Part 1: Beginner</strong></td>
<td>You are new to the screener or to indicators.</td>
<td>How to use the page, the ready-made strategies, the 6 key indicators and the basic columns.</td>
</tr>
<tr class="even">
<td><strong>Part 2: Intermediate</strong></td>
<td>You know RSI and EMA and want to use futures data.</td>
<td>Open Interest and funding, the intermediate strategies, and building your own strategy.</td>
</tr>
<tr class="odd">
<td><strong>Part 3: Advanced</strong></td>
<td>You want full control and exact numbers.</td>
<td>Every condition, custom values, multi-timeframe setups, the threshold tables and how the data works.</td>
</tr>
</tbody>
</table></div>
<h1 id="part-1" class="part">Part 1: Beginner</h1>
<h2 id="1-1"><span class="num">1.1</span> Quick start</h2>
<p>You can find your first setups in five steps: pick an exchange, pick a strategy, narrow the markets, read the list, then click a pair for its chart.</p>
<ol type="1">
<li><strong>Pick an exchange</strong> at the top. The list shows every pair on that exchange.</li>
<li><strong>Pick a strategy</strong> from the <strong>Strategy</strong> dropdown. Start with a Quick filter such as <strong>High Volume</strong> or a beginner strategy such as <strong>Buy the dip</strong>. The list now shows only pairs that match. You can select more than one.</li>
<li><strong>Narrow the markets</strong> in the second row:
<ul>
<li><strong>Market:</strong> spot, futures, or all.</li>
<li><strong>Asset class</strong> and <strong>Quote</strong> (for example USDT pairs only).</li>
<li><strong>24h volume:</strong> set a minimum and maximum. <strong>$10M+</strong> is a good start to remove tiny coins that are hard to buy and sell.</li>
</ul></li>
<li><strong>Read the list.</strong> The count on the right (for example "12 of 1,472 markets") shows how many pairs passed. Use <strong>Search</strong> to find a coin.</li>
<li><strong>Click a pair</strong> to open its snapshot: price, 24h change, 24h volume and a 1h chart. From there you can open the pair on the exchange.</li>
</ol>
<p>Other buttons:</p>
<ul>
<li>Each active strategy shows as a chip with <strong>✕</strong> to remove only that one. <strong>Clear all</strong> removes every strategy and shows the full list again.</li>
<li><strong>Reset all</strong> appears when you change a filter and puts every filter back to default.</li>
<li>The star icon adds a pair to your watchlist.</li>
</ul>
<h2 id="1-2"><span class="num">1.2</span> Ready-made strategies</h2>
<p>A strategy is a saved set of conditions; choosing one shows only the pairs that match. When you select several, a pair shows if it matches <strong>any</strong> of them, so the list gets longer, not shorter.</p>
<p>Each strategy has a tag:</p>
<ul>
<li><strong>Buy / Long idea:</strong> price may go up.</li>
<li><strong>Sell / Short idea:</strong> price may go down.</li>
<li><strong>Watch:</strong> something is happening, but the direction is unclear.</li>
<li><strong>Avoid:</strong> a warning sign.</li>
</ul>

<h2 id="1-3"><span class="num">1.3</span> The 6 indicators beginners need</h2>
<p>The beginner strategies are built from these six. Learn them first.</p>
<div class="tw"><table>
<thead>
<tr class="header">
<th>Indicator</th>
<th>What it tells you</th>
<th>How to read it</th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td><strong>EMA</strong> (moving average)</td>
<td>The average price over time.</td>
<td>Price above EMA = uptrend. Below = downtrend. EMA 200 = long-term, EMA 20 = short-term.</td>
</tr>
<tr class="even">
<td><strong>RSI (14)</strong></td>
<td>Momentum, from 0 to 100.</td>
<td>Below 30 = oversold (sold too much). Above 70 = overbought (bought too much). Above 50 = buyers stronger.</td>
</tr>
<tr class="odd">
<td><strong>ADX (14)</strong></td>
<td>How strong the trend is, not its direction.</td>
<td>Above 25 = strong trend. Below 20 = choppy, no clear trend.</td>
</tr>
<tr class="even">
<td><strong>SuperTrend</strong></td>
<td>A simple trend signal.</td>
<td>Green (bullish) = uptrend. Red (bearish) = downtrend.</td>
</tr>
<tr class="odd">
<td><strong>Bollinger Bands</strong></td>
<td>How tight or wide price swings are.</td>
<td>A <strong>squeeze</strong> (very tight bands) often comes before a big move.</td>
</tr>
<tr class="even">
<td><strong>RVOL</strong></td>
<td>Volume compared with normal.</td>
<td>2x = twice the usual volume. People are paying attention.</td>
</tr>
</tbody>
</table></div>

<h2 id="1-5"><span class="num">1.5</span> Beginner mistakes</h2>
<ul>
<li><strong>Treating a match as a buy signal.</strong> A strategy only shows coins that fit a pattern, and patterns fail often. Open the chart and plan your stop loss before entering.</li>
<li><strong>No volume filter.</strong> Tiny coins jump on small trades and can be hard to sell. Set <strong>24h volume</strong> to at least <strong><span class="math inline">5<em>M</em>–</span>10M</strong> unless you understand the risk.</li>
<li><strong>Expecting results to change every few seconds.</strong> Indicators update when a candle closes, so a 1h strategy changes once an hour. Check <strong>Updated at</strong>.</li>
</ul>
<h1 id="part-2" class="part">Part 2: Intermediate</h1>
<h2 id="2-1"><span class="num">2.1</span> Futures data basics</h2>
<p>Futures data shows <strong>who is positioned and how crowded they are</strong>, which price charts alone can't tell you. This data exists for futures only, so strategies that use it never show spot pairs.</p>
<div class="tw"><table>
<thead>
<tr class="header">
<th>Term</th>
<th>What it means</th>
<th>How to read it</th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td><strong>Open Interest (OI)</strong></td>
<td>The number of futures contracts still open.</td>
<td>OI rising = new money entering. OI falling = positions closing.</td>
</tr>
<tr class="even">
<td><strong>Funding rate</strong></td>
<td>What longs and shorts pay each other to keep positions open, shown per hour.</td>
<td>Positive = longs crowded (longs pay shorts). Negative = shorts crowded.</td>
</tr>
<tr class="odd">
<td><strong>Premium / basis</strong></td>
<td>Futures price compared with spot (index) price.</td>
<td>Premium = traders paying extra to be long. Discount = the opposite.</td>
</tr>
<tr class="even">
<td><strong>Long/short ratio</strong></td>
<td>How many accounts are long vs short.</td>
<td>Above 1.5 = mostly long. Below 0.7 = mostly short.</td>
</tr>
</tbody>
</table></div>
<p><strong>Market positioning</strong> combines price and OI into one plain answer:</p>
<div class="tw"><table>
<thead>
<tr class="header">
<th>Price</th>
<th>OI</th>
<th>Name</th>
<th>What it means</th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td>Up</td>
<td>Up</td>
<td><strong>New longs</strong></td>
<td>New buyers are opening positions. Strong move.</td>
</tr>
<tr class="even">
<td>Down</td>
<td>Up</td>
<td><strong>New shorts</strong></td>
<td>New sellers are opening positions.</td>
</tr>
<tr class="odd">
<td>Up</td>
<td>Down</td>
<td><strong>Short covering</strong></td>
<td>Shorts are closing. The move is often temporary.</td>
</tr>
<tr class="even">
<td>Down</td>
<td>Down</td>
<td><strong>Long liquidation</strong></td>
<td>Longs are exiting or getting liquidated.</td>
</tr>
</tbody>
</table></div>
<h2 id="2-2"><span class="num">2.2</span> Intermediate strategies (all futures only)</h2>
<div class="tw"><table>
<thead>
<tr class="header">
<th>Strategy</th>
<th>Tag</th>
<th>What it finds</th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td><strong>Breakout with new money</strong></td>
<td>Buy / Long idea</td>
<td>New 20-candle high, high volume, rising OI, and price above the trend EMA. New positions back the breakout, so it's more likely to hold.</td>
</tr>
<tr class="even">
<td><strong>Short squeeze watch</strong></td>
<td>Buy / Long idea</td>
<td>Negative funding (shorts crowded), rising OI, and RSI just crossed above 50. Shorts may be forced to buy back, pushing price up fast.</td>
</tr>
<tr class="odd">
<td><strong>Overheated longs</strong></td>
<td>Sell / Short idea</td>
<td>RSI above 75, high funding (longs crowded), and a large OI rise. A small drop can trigger a chain of liquidations.</td>
</tr>
<tr class="even">
<td><strong>Fake pump warning</strong></td>
<td>Avoid</td>
<td>Big price jump with extreme volume while OI falls. The move came from shorts closing, not new buyers, and often fades. Don't chase.</td>
</tr>
<tr class="odd">
<td><strong>Strong trend, healthy leverage</strong></td>
<td>Buy / Long idea</td>
<td>SuperTrend bullish, rising OI, and funding between 0 and 0.003% per hour. An uptrend that isn't crowded.</td>
</tr>
</tbody>
</table></div>
<h2 id="2-3"><span class="num">2.3</span> Customize and create your own strategy</h2>
<p>You can change any built-in strategy or build your own from scratch; each condition checks one indicator on one timeframe.</p>
<ol type="1">
<li>Click <strong>Customize</strong> on a built-in strategy to start from a copy, or <strong>Create strategy</strong> to start empty.</li>
<li>Give it a <strong>name</strong> and a <strong>type</strong> (Buy / Long idea, Sell / Short idea, Watch, Avoid).</li>
<li>Add conditions. For each one, pick the <strong>indicator</strong>, the <strong>timeframe</strong>, and a ready-made <strong>choice</strong> in plain words, such as <strong>Oversold (below 30)</strong>.</li>
<li>Choose <strong>Match all</strong> (a pair must pass every condition) or <strong>Match any</strong> (one is enough).</li>
<li>Read the sentence at the top to check your logic, for example "Find coins where RSI on 1h is oversold (below 30) AND SuperTrend on 4h just turned bullish". The list previews results live.</li>
<li>Click <strong>Save</strong>. It appears under <strong>My strategies</strong>, with <strong>Edit</strong> and <strong>Delete</strong>.</li>
</ol>
<p>Keep it simple: start with <strong>2–3 conditions</strong>. With Match all, every extra condition removes more coins, and the list is often empty.</p>
<p>Saved strategies live <strong>in this browser only</strong>. They won't appear on another device, and clearing your browser data removes them.</p>
<h2 id="2-4"><span class="num">2.4</span> More columns</h2>
<div class="tw"><table>
<thead>
<tr class="header">
<th>Column</th>
<th>What it means</th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td><strong>OI $</strong></td>
<td>Total value of open futures positions, in USD.</td>
</tr>
<tr class="even">
<td><strong>OI CHG % (period)</strong></td>
<td>Change in the number of open contracts, in %. Rising = new money in.</td>
</tr>
<tr class="odd">
<td><strong>Funding/h</strong></td>
<td>Current funding rate per hour. Positive = longs pay shorts.</td>
</tr>
<tr class="even">
<td><strong>RVOL</strong></td>
<td>Recent volume vs its usual level.</td>
</tr>
<tr class="odd">
<td><strong>VLT (period)</strong></td>
<td>Volatility: high-to-low range as % of price. Higher = moves more.</td>
</tr>
<tr class="even">
<td><strong>TRADES (period)</strong></td>
<td>Number of trades in the period. Not every exchange provides it.</td>
</tr>
<tr class="odd">
<td><strong>MCAP</strong></td>
<td>Market cap, when the exchange provides it; otherwise <strong>N/A</strong>.</td>
</tr>
</tbody>
</table></div>
<p><strong>OI $ vs OI CHG %:</strong> OI $ is a dollar value, so it rises when price rises even if nobody opens a new position. <strong>OI CHG %</strong> counts contracts, so it shows real new positions. Use OI CHG % to judge whether new money is entering.</p>
<h1 id="part-3" class="part">Part 3: Advanced</h1>
<h2 id="3-1"><span class="num">3.1</span> Every condition</h2>
<p>All conditions use <strong>completed candles only</strong>, so values don't change while a candle is still forming. "Just crossed" means the cross happened in the last 3 candles (5m to 4h) or the last 2 candles (8h to 1d).</p>
<p><strong>Trend: which way is it moving?</strong></p>
<div class="tw"><table>
<thead>
<tr class="header">
<th>Condition</th>
<th>What it tells you</th>
<th>Choices</th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td><strong>Price vs EMA</strong> (20, 50, 100, 200)</td>
<td>Price above or below its average.</td>
<td>Above, Below, Just crossed above, Just crossed below</td>
</tr>
<tr class="even">
<td><strong>EMA cross</strong> (9/21, 20/50, 50/200)</td>
<td>A fast average crossing a slow one = trend changing. 50/200 = golden cross / death cross.</td>
<td>Bullish (fast above slow), Bearish, Just crossed up, Just crossed down</td>
</tr>
<tr class="odd">
<td><strong>Trend direction (+DI / −DI)</strong></td>
<td>Whether buyers or sellers are in control.</td>
<td>Buyers in control, Sellers in control</td>
</tr>
<tr class="even">
<td><strong>ADX (14)</strong></td>
<td>Trend strength, not direction.</td>
<td>Strong trend (&gt;25), Very strong (&gt;40), Choppy (&lt;20), Custom</td>
</tr>
<tr class="odd">
<td><strong>SuperTrend (10, 3)</strong></td>
<td>Volatility-based trend direction.</td>
<td>Bullish, Bearish, Just turned bullish, Just turned bearish</td>
</tr>
<tr class="even">
<td><strong>Distance from EMA %</strong></td>
<td>How far price has stretched from its average.</td>
<td>Stretched above (&gt;10%), Stretched below (&lt;−10%), Custom</td>
</tr>
</tbody>
</table></div>
<p><strong>Momentum: is it stretched or speeding up?</strong></p>
<div class="tw"><table>
<thead>
<tr class="header">
<th>Condition</th>
<th>What it tells you</th>
<th>Choices</th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td><strong>RSI (14)</strong></td>

<h2 id="3-2"><span class="num">3.2</span> Custom values and multi-timeframe setups</h2>
<p><strong>Custom</strong> lets you type your own number, using plain words: <strong>is above</strong>, <strong>is below</strong>, <strong>is between</strong>, and <strong>moved more than (up or down)</strong> for values that can be negative. Invalid values, such as RSI 150 or a range whose low is above its high, show a message and can't be saved.</p>
<p>Each condition's timeframe can be <strong>Selected timeframe</strong> (follows the default, 1h) or pinned to a fixed one. Pinning lets you combine timeframes: use a <strong>bigger timeframe for direction</strong> and a <strong>smaller one for timing</strong>.</p>
<ul>
<li>Price above EMA 200 on <strong>4h</strong> AND RSI just crossed above 50 on <strong>1h</strong>: uptrend, momentum just turned up.</li>
<li>SuperTrend bullish on <strong>1d</strong> AND Stoch RSI turning up on <strong>1h</strong>: daily uptrend, short-term entry.</li>
<li>Bollinger squeeze on <strong>4h</strong> AND Market positioning: New longs on <strong>1h</strong>: a coiled market where new longs are starting to open.</li>
</ul>

<h1 id="part-1" class="part">Bahagian 1: Beginner</h1>
<h2 id="1-1"><span class="num">1.1</span> Cara mula</h2>
<p>Boleh jumpa setup pertama dalam 5 langkah: pilih exchange, pilih strategy, tapis market, baca list, lepas tu klik pair untuk tengok chart.</p>
<ol type="1">
<li><strong>Pilih exchange</strong> kat atas. List akan tunjuk semua pair kat exchange tu.</li>
<li><strong>Pilih strategy</strong> dari dropdown <strong>Strategy</strong>. Mula dengan Quick filter macam <strong>High Volume</strong>, atau strategy beginner macam <strong>Buy the dip</strong>. List akan tunjuk pair yang match je. Boleh pilih lebih dari satu.</li>
<li><strong>Tapis market</strong> kat row kedua:
<ul>
<li><strong>Market:</strong> spot, futures, atau semua.</li>
<li><strong>Asset class</strong> dan <strong>Quote</strong> (contoh, pair USDT je).</li>
<li><strong>24h volume:</strong> set minimum dan maximum. <strong>$10M+</strong> permulaan yang bagus untuk buang coin kecil yang susah nak jual beli.</li>
</ul></li>
<li><strong>Baca list.</strong> Nombor kat kanan (contoh "12 of 1,472 markets") tunjuk berapa pair yang lepas. Guna <strong>Search</strong> untuk cari coin.</li>
<li><strong>Klik pair</strong> untuk buka snapshot: harga, 24h change, 24h volume dan chart 1h. Dari situ boleh terus buka pair tu kat exchange.</li>
</ol>
<p>Butang lain:</p>
<ul>
<li>Setiap strategy yang aktif ada chip dengan <strong>✕</strong> untuk buang yang tu je. <strong>Clear all</strong> buang semua strategy dan tunjuk list penuh balik.</li>
<li><strong>Reset all</strong> keluar bila korang ubah filter, dan set balik semua filter ke default.</li>
<li>Icon bintang tambah pair ke watchlist.</li>
</ul>
<h2 id="1-2"><span class="num">1.2</span> Strategy siap</h2>
<p>Strategy ni set condition yang dah siap. Bila pilih satu, list akan tunjuk pair yang match je. Kalau pilih banyak, pair akan keluar kalau dia match <strong>mana-mana satu</strong>, jadi list jadi makin panjang, bukan makin pendek.</p>
<p>Setiap strategy ada tag:</p>
<ul>
<li><strong>Buy / Long idea:</strong> harga mungkin naik.</li>
<li><strong>Sell / Short idea:</strong> harga mungkin turun.</li>
<li><strong>Watch:</strong> ada benda tengah jadi, tapi arah belum jelas.</li>
<li><strong>Avoid:</strong> tanda bahaya.</li>
</ul>

<h2 id="1-5"><span class="num">1.5</span> Mistake beginner</h2>
<ul>
<li><strong>Anggap match = signal beli.</strong> Strategy cuma tunjuk coin yang ikut pattern, dan pattern selalu gagal. Buka chart dan plan stop loss sebelum masuk.</li>
<li><strong>Tak letak filter volume.</strong> Coin kecil senang melonjak dengan trade kecil dan susah nak jual. Set <strong>24h volume</strong> sekurang-kurangnya <strong><span class="math inline">5<em>M</em>–</span>10M</strong> kecuali korang faham risikonya.</li>
<li><strong>Harap result berubah setiap beberapa saat.</strong> Indicator update bila candle tutup, jadi strategy 1h berubah sejam sekali. Tengok <strong>Updated at</strong>.</li>
</ul>
<h1 id="part-2" class="part">Bahagian 2: Intermediate</h1>

<p>Data futures tunjuk <strong>siapa yang tengah pegang posisi dan berapa ramai</strong>, benda yang chart harga je tak boleh bagitahu. Data ni untuk futures je, jadi strategy yang guna data ni takkan tunjuk spot pair.</p>

<h2 id="2-3"><span class="num">2.3</span> Customize dan buat strategy sendiri</h2>
<p>Korang boleh ubah mana-mana strategy built-in atau buat sendiri dari kosong. Setiap condition check satu indicator pada satu timeframe.</p>
<ol type="1">
<li>Klik <strong>Customize</strong> pada strategy built-in untuk mula dari copy, atau <strong>Create strategy</strong> untuk mula dari kosong.</li>
<li>Bagi <strong>nama</strong> dan <strong>type</strong> (Buy / Long idea, Sell / Short idea, Watch, Avoid).</li>
<li>Tambah condition. Untuk setiap satu, pilih <strong>indicator</strong>, <strong>timeframe</strong>, dan <strong>choice</strong> siap dalam ayat mudah, contoh <strong>Oversold (below 30)</strong>.</li>
<li>Pilih <strong>Match all</strong> (pair kena lepas semua condition) atau <strong>Match any</strong> (lepas satu pun dah cukup).</li>
<li>Baca ayat kat atas untuk check logic korang, contoh "Find coins where RSI on 1h is oversold (below 30) AND SuperTrend on 4h just turned bullish". List akan tunjuk result terus.</li>
<li>Klik <strong>Save</strong>. Strategy akan keluar bawah <strong>My strategies</strong>, dengan <strong>Edit</strong> dan <strong>Delete</strong>.</li>
</ol>
<p>Buat simple dulu: mula dengan <strong>2–3 condition</strong>. Dengan Match all, setiap condition tambahan buang lebih banyak coin, dan list selalu jadi kosong.</p>
<p>Strategy yang disave ada <strong>dalam browser ni je</strong>. Takkan keluar kat device lain, dan kalau clear browser data, strategy akan hilang.</p>

<h2 id="3-2"><span class="num">3.2</span> Nilai custom dan setup multi-timeframe</h2>
<p><strong>Custom</strong> bagi korang taip nombor sendiri, guna perkataan mudah: <strong>is above</strong>, <strong>is below</strong>, <strong>is between</strong>, dan <strong>moved more than (up or down)</strong> untuk nilai yang boleh negatif. Nilai yang tak masuk akal, macam RSI 150 atau julat yang nilai rendah lebih tinggi dari nilai tinggi, akan keluar mesej dan tak boleh save.</p>
<p>Timeframe setiap condition boleh jadi <strong>Selected timeframe</strong> (ikut default, 1h) atau tetap pada satu timeframe. Bila tetapkan timeframe, korang boleh gabung banyak timeframe: guna <strong>timeframe besar untuk arah</strong> dan <strong>timeframe kecil untuk timing</strong>.</p>
<ul>
<li>Price above EMA 200 on <strong>4h</strong> AND RSI just crossed above 50 on <strong>1h</strong>: uptrend, dan momentum baru pusing naik.</li>
<li>SuperTrend bullish on <strong>1d</strong> AND Stoch RSI turning up on <strong>1h</strong>: uptrend harian, masuk ikut timing jangka pendek.</li>
<li>Bollinger squeeze on <strong>4h</strong> AND Market positioning: New longs on <strong>1h</strong>: market tengah mampat dan long baru mula masuk.</li>
</ul>

<h2 id="3-5"><span class="num">3.5</span> Cara data berfungsi</h2>
<p>Page refresh lebih kurang setiap <strong>30 saat</strong>, tapi condition indicator hanya berubah bila candle tutup. Harga dan funding adalah live. RSI, EMA dan indicator lain guna candle yang dah tutup. <strong>Updated at</strong> tunjuk bila candle terakhir tutup.</p>

<script>
(function(){
  var UI={en:{back:"Back to screener",guide:"Guide",sections:"Jump to section"},bm:{back:"Kembali ke screener",guide:"Panduan",sections:"Pergi ke bahagian"}};
  var main=document.getElementById('content'),toc=document.getElementById('toc'),sel=document.getElementById('mobsel');
  var observer=null;
  function getLang(){
    var q=new URLSearchParams(location.search).get('lang');
    if(q==='en'||q==='bm')return q;
    try{var s=localStorage.getItem('bkp-guide-lang');if(s==='en'||s==='bm')return s}catch(e){}
    return 'en';
  }
  function setLang(l,keepScroll){
    try{localStorage.setItem('bkp-guide-lang',l)}catch(e){}
    document.documentElement.lang=l==='bm'?'ms':'en';
    document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.lang===l))});
    document.querySelectorAll('[data-t]').forEach(function(el){el.textContent=UI[l][el.dataset.t]});
    var cur=location.hash;
    main.innerHTML='';
    main.appendChild(document.getElementById('tpl-'+l).content.cloneNode(true));
    buildNav(l);
    if(cur&&document.getElementById(cur.slice(1))){document.getElementById(cur.slice(1)).scrollIntoView()}
    else if(!keepScroll){window.scrollTo(0,0)}
  }
  function buildNav(l){
    toc.innerHTML='';sel.innerHTML='<option value="">'+UI[l].sections+'</option>';
    var grp=null,links=[];
    main.querySelectorAll('h1.part,h2[id]').forEach(function(h){
      var a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent.trim();
      var o=document.createElement('option');o.value=h.id;
      if(h.tagName==='H1'){grp=document.createElement('div');grp.className='grp';a.className='gt';grp.appendChild(a);toc.appendChild(grp);o.textContent=a.textContent}
      else{a.className='gl';(grp||toc).appendChild(a);o.textContent='  '+a.textContent}
      sel.appendChild(o);links.push([h,a]);
    });
    if(observer)observer.disconnect();
    if('IntersectionObserver' in window){
      observer=new IntersectionObserver(function(entries){
        entries.forEach(function(e){if(e.isIntersecting){
          links.forEach(function(p){p[1].classList.toggle('on',p[0]===e.target)});
        }});
      },{rootMargin:'-80px 0px -70% 0px'});
      links.forEach(function(p){observer.observe(p[0])});
    }
  }
  document.querySelectorAll('.lang button').forEach(function(b){b.addEventListener('click',function(){setLang(b.dataset.lang,true)})});
  sel.addEventListener('change',function(){if(sel.value){location.hash=sel.value;sel.value=''}});
  setLang(getLang(),false);
})();
</script>
