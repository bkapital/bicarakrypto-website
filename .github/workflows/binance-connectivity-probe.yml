name: Binance connectivity probe

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/binance-connectivity-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Binance Spot control
            url: https://data-api.binance.vision/api/v3/ticker/24hr?symbol=BTCUSDT
          - label: Binance Futures ticker
            url: https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=BTCUSDT
          - label: Binance Futures exchange info
            url: https://fapi.binance.com/fapi/v1/exchangeInfo
    name: ${{ matrix.label }}
    steps:
      - name: Check endpoint reachability
        run: |
          node --input-type=module -e '
          try {
            const response = await fetch(process.env.PROBE_URL, { signal: AbortSignal.timeout(15000) });
            const body = (await response.text()).replace(/\s+/g, " ").slice(0, 160);
            console.log(`HTTP ${response.status}; ${body}`);
            if (!response.ok) process.exitCode = 1;
          } catch (error) {
            console.log(`FETCH ERROR; ${error instanceof Error ? error.message : String(error)}`);
            process.exitCode = 1;
          }'
        env:
          PROBE_URL: ${{ matrix.url }}
