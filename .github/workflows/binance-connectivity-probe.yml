name: Binance connectivity probe

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/binance-connectivity-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Compare public Spot and Futures API access
        run: |
          node --input-type=module <<'NODE'
          const endpoints = [
            ['Binance Spot control', 'https://data-api.binance.vision/api/v3/ticker/24hr?symbol=BTCUSDT'],
            ['Binance USDⓈ-M Futures ticker', 'https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=BTCUSDT'],
            ['Binance USDⓈ-M Futures exchange info', 'https://fapi.binance.com/fapi/v1/exchangeInfo'],
          ];
          for (const [label, url] of endpoints) {
            try {
              const response = await fetch(url, { signal: AbortSignal.timeout(15000) });
              const body = (await response.text()).replace(/\s+/g, ' ').slice(0, 240);
              console.log(`${label}: HTTP ${response.status}; ${body}`);
            } catch (error) {
              console.log(`${label}: FETCH ERROR; ${error instanceof Error ? error.message : String(error)}`);
            }
          }
          NODE
