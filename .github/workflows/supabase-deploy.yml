name: Deploy Supabase screener backend

on:
  push:
    branches: [staging]
    paths:
      - 'supabase/**'
      - 'src/pages/ScreenerPage.tsx'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI v2
        uses: supabase/setup-cli@v3
        with:
          version: ^2

      - name: Link and apply database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Set refresh credential when configured
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          TA_REFRESH_SECRET: ${{ secrets.TA_REFRESH_SECRET }}
        run: |
          if [[ -n "$TA_REFRESH_SECRET" ]]; then
            supabase secrets set "TA_REFRESH_SECRET=$TA_REFRESH_SECRET" --project-ref "$SUPABASE_PROJECT_ID"
          else
            echo "TA_REFRESH_SECRET is not configured yet; the technical indicator refresh will stay idle."
          fi

      - name: Deploy market data Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase functions deploy market-data --project-ref "$SUPABASE_PROJECT_ID"
